<!doctype html>
<!--
  YouTube player hosted on a real web address, driven by the app through
  postMessage. YouTube refuses an embedded player whose page sends no
  Referer (error 153). That happens in the live-video picture-in-picture
  window (an about:blank document) and in the desktop/Android app, whose
  pages live on tauri:// / tauri.localhost. The app embeds this page instead:
  same origin on the web, the hosted copy (APP_METADATA.urls.webApp) in the app.

  Commands are accepted from this page's own origin (the PiP case, where the
  sender is the app's main window) or from the embedding window. They only
  drive playback, and the replies only carry the playback time.

  App -> page: { ovsYoutube: true, type: 'init', videoId }
               { ovsYoutube: true, type: 'play' | 'pause' }
               { ovsYoutube: true, type: 'seek', seconds, autoplay }
               { ovsYoutube: true, type: 'rate', rate }
  Page -> app: { ovsYoutube: true, type: 'ready' | 'error' }
               { ovsYoutube: true, type: 'state', time, paused }
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube</title>
    <style>
      html, body, #player { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <script>
      (function () {
        var player = null;
        var ready = false;
        var replyOrigin = window.location.origin;
        var send = function (message) {
          message.ovsYoutube = true;
          window.parent.postMessage(message, replyOrigin);
        };

        window.addEventListener('message', function (event) {
          if (event.origin !== window.location.origin && event.source !== window.parent) return;
          var data = event.data;
          if (!data || data.ovsYoutube !== true) return;
          if (data.type === 'init' && !player) {
            // tauri:// origins cannot be named as a postMessage target.
            replyOrigin = /^https?:/.test(event.origin) ? event.origin : '*';
            createPlayer(String(data.videoId || ''));
            return;
          }
          if (!ready) return;
          if (data.type === 'play') player.playVideo();
          else if (data.type === 'pause') player.pauseVideo();
          else if (data.type === 'seek') {
            player.seekTo(Math.max(0, Number(data.seconds) || 0), true);
            if (data.autoplay) player.playVideo();
          } else if (data.type === 'rate') player.setPlaybackRate(Number(data.rate) || 1);
        });

        function createPlayer(videoId) {
          window.onYouTubeIframeAPIReady = function () {
            player = new window.YT.Player('player', {
              videoId: videoId,
              width: '100%',
              height: '100%',
              playerVars: { rel: 0, playsinline: 1 },
              events: {
                onReady: function () {
                  ready = true;
                  send({ type: 'ready' });
                },
                onError: function () { send({ type: 'error' }); },
              },
            });
          };
          var script = document.createElement('script');
          script.src = 'https://www.youtube.com/iframe_api';
          script.onerror = function () { send({ type: 'error' }); };
          document.head.appendChild(script);
        }

        window.setInterval(function () {
          if (!ready) return;
          var state = player.getPlayerState();
          send({ type: 'state', time: player.getCurrentTime(), paused: state !== 1 && state !== 3 });
        }, 200);
      })();
    </script>
  </body>
</html>
