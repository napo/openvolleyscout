<!doctype html>
<!--
  Social preview (1280 × 640) for the site and the repository.
  Rendered to public/social-preview.png: see README.md next to this file.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Ubuntu'; font-weight: 400; src: url('Ubuntu-Regular.ttf'); }
      @font-face { font-family: 'Ubuntu'; font-weight: 700; src: url('Ubuntu-Bold.ttf'); }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        position: relative;
        font-family: 'Ubuntu', sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #e8f0fb 100%);
        color: #0b1b33;
      }
      .band { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #002554; }
      .band::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: #1a73e8; }
      .cover {
        position: absolute;
        left: 56px;
        top: 40px;
        width: 330px;
        filter: drop-shadow(0 14px 30px rgba(0, 37, 84, 0.22));
      }
      .text { position: absolute; left: 60px; top: 382px; width: 560px; }
      p { margin: 0; font-size: 26px; line-height: 1.4; font-weight: 700; color: #1f2937; }
      .chips { display: flex; gap: 12px; margin-top: 26px; }
      .chip { padding: 9px 18px; border-radius: 999px; background: #002554; color: #fff; font-size: 18px; font-weight: 700; }
      .shot {
        position: absolute;
        left: 640px;
        top: 80px;
        width: 760px;
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 37, 84, 0.28);
        transform: rotate(-3deg);
        border: 1px solid rgba(0, 37, 84, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="band"></div>
    <img class="cover" src="og-cover.png" alt="" />
    <div class="text">
      <p>Collect match data, analyse it, produce statistics and link every action to the video.</p>
      <div class="chips">
        <span class="chip">Data collection</span>
        <span class="chip">Statistics</span>
        <span class="chip">Video</span>
      </div>
    </div>
    <img class="shot" src="og-app.png" alt="" />
  </body>
</html>
